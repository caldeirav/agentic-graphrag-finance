name: CI

on:
  push:
    branches: [main, "0*-*"]
  pull_request:
    branches: [main, "0*-*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit and contract tests
        env:
          USE_MOCK_LLM: "1"
          USE_MOCK_JUDGE: "1"
          SEC_API_KEY: test-mock
        run: uv run pytest tests/unit tests/contract -q
      - name: Integration tests
        env:
          USE_MOCK_LLM: "1"
          USE_MOCK_JUDGE: "1"
          SEC_API_KEY: test-mock
        run: uv run pytest tests/integration -q
