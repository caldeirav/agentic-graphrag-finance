eval_split: dev
reproduction_mode: live_reexecution

corpus_hashes:
  corpus/graph_node_index.json: "sha256:ecfa94e8e6ffc596b695bba5998a02af6639614f8643edf8ca2d46055cdc3071"

items_hash: "sha256:698eab019fbd33ec2dff753a06cb66e9f461f49cbff35b8dde97dca7a841e1ba"
relevance_labels_hash: "sha256:bec55a1cdb1b0218bab0910e7441894a3f960364f0fde1429c5c85728ff1e1a6"
relevance_coverage_rate: 1.0

variant_ids:
  - graph-full
  - flat-chunk
  - ablation-no-macro
  - ablation-no-walker
  - ablation-xbrl-only

model_pins:
  llm_config_path: configs/llm/lm_studio_qwen.yaml
  llm_config_hash: "sha256:TBD"
  judge_config_path: configs/judges/gemini_2_5_pro.yaml
  judge_config_hash: "sha256:TBD"
  embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
