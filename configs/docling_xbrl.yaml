# Docling XBRL pipeline — https://docling-project.github.io/docling/examples/xbrl_conversion/
pipeline:
  name: xbrl_conversion
  options:
    preserve_table_structure: true
    preserve_footnotes: true
    do_ocr: false

# XBRL backend (XBRLBackendOptions)
xbrl:
  enable_local_fetch: true
  # SEC filings reference US-GAAP / DEI taxonomies online; set false only with taxonomy_package.zip
  enable_remote_fetch: true

parse_confidence_threshold: 0.5
