model: gemini-2.5-pro
temperature: 0.0
judge_config_id: gemini_2_5_pro
rubrics:
  trajectory_coherence: |
    Score 0.0-1.0 whether the plan, document route, graph hops, and evidence tell a
    consistent auditable story for the question. Use evaluation_as_of and filed_at on
    document_route: filings are real SEC EDGAR accessions from the bound corpus snapshot.
    Do NOT penalize Apple-style FY labels (e.g. FY2025) as "hypothetical" or "future"
    when filed_at is on or before evaluation_as_of. Penalize only internal contradictions
    (route vs hops vs evidence accession mismatch, missing stages, incoherent plan).
  routing_decisions: |
    Score 0.0-1.0 whether filing bindings, intent classification, and section choices
    were reasonable for the question. Attribute stage when weak (macro, intent, meso, micro).
  retrieval_fidelity: |
    Score 0.0-1.0 whether evidence supports the question; periods and form types align
    with the document route.
  synthesis_grounding: |
    Score 0.0-1.0 whether the final answer stays within cited evidence without unsupported claims.
    Score 0.0 when the response is primarily verbatim chunk concatenation without answering the question.
    Score 0.0 when citations reference the wrong issuer or filing relative to expected_bindings.
    Do not reward abstention ("insufficient evidence") when the trajectory contains usable evidence.
  answer_quality: |
    Score 0.0-1.0 whether the response substantively addresses the question using retrieved evidence.
    Score 0.0 for chunk-dump answers that quote excerpts without synthesis or direct question answering.
  value_alignment: |
    Score 0.0-1.0 whether the answer matches ground_truth.answer (numeric tolerance where applicable).
    For narrative ground truth, score claim coverage against required_claims when present; do not reward
    header or fragment overlap without semantic substance.
    Score 0.0 for abstention or refusal when ground truth expects a substantive answer.
    Penalize fabricated numbers and claims not supported by cited evidence.
  claim_presence: |
    Score 0.0-1.0 whether required factual claims from ground_truth.rubric appear in the answer.
    Score 0.0 when the answer abstains but the rubric expects specific claims.
  trajectory_fidelity: |
    Score 0-1 whether the agent trajectory aligns with expected navigation. (legacy)
